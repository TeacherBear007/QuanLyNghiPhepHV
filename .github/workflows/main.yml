name: Deploy QuanLyNghiPhepHV production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-qlhv-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 24700
          script_stop: true
          command_timeout: 10m
          script: |
            set -e

            # Thư mục đích trên server
            APP_DIR="/root/hoanganh007/qlhv"

            echo "==> 1. Đảm bảo thư mục tồn tại và di chuyển vào trong"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            echo "==> 2. Đồng bộ mã nguồn thông minh (An toàn tuyệt đối cho file .env)"
            if [ ! -d ".git" ]; then
              echo "==> Server chưa có git, tiến hành khởi tạo và kết nối remote..."
              git init -q -b main
              
              # Thêm remote origin nếu chưa có
              if ! git remote | grep -q "^origin$"; then
                git remote add origin "https://github.com/${{ github.repository }}.git"
              fi
              
              git fetch origin main
              git reset --hard origin/main
            else
              echo "==> Server đã có sẵn git, thực hiện fetch và reset hard..."
              git fetch origin
              git reset --hard origin/main
            fi

            echo "==> 3. Đảm bảo các thư mục runtime tồn tại"
            mkdir -p logs backups init-scripts Files-Upload

            echo "==> 4. Build và khởi động lại Docker containers"
            docker compose -p qlhv up -d --build --remove-orphans

            echo "==> 5. Kiểm tra danh sách container đang chạy"
            docker compose -p qlhv ps

            echo "==> 6. Kiểm tra phản hồi nội bộ (curl internal)"
            curl -I http://127.0.0.1:7187 || true

            echo "==> 7. Kiểm tra cấu hình và reload Nginx"
            nginx -t
            systemctl reload nginx

            echo "==> Deploy hoàn tất thành công!"
